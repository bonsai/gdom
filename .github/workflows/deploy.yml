name: Deploy to GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create .clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON_BASE64 }}' | base64 -d > ~/.clasprc.json
          echo "Verifying and fixing JSON..."
          node -e "const fs = require('fs'); const p = process.env.HOME + '/.clasprc.json'; try { const c = JSON.parse(fs.readFileSync(p)); console.log('Keys:', Object.keys(c)); if (c.tokens && c.tokens.default) { console.log('Found tokens.default, polyfilling root token...'); c.token = c.tokens.default; fs.writeFileSync(p, JSON.stringify(c)); } else { console.log('tokens.default not found'); } } catch (e) { console.error(e); process.exit(1); }"

      - name: Push to GAS
        run: clasp push --force
