name: Deploy to GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create .clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON_BASE64 }}' | base64 -d > ~/.clasprc.json
          echo "Verifying JSON validity..."
          node -e "try { const c = JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json')); console.log('JSON is valid. Keys:', Object.keys(c)); } catch (e) { console.error('Invalid JSON'); process.exit(1); }"

      - name: Push to GAS
        run: clasp push --force
